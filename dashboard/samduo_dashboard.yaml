# SAMDUO Nex plug-and-play dashboard
#
# Requires the apexcharts-card from HACS (https://github.com/RomRider/apexcharts-card).
# Entity ids assume the battery is named "Samduo" (the default). If you gave it
# another name, replace "samduo_" with your name, e.g. "garage_battery_".
#
# Settings -> Dashboards -> Add dashboard -> New dashboard from scratch -> open it
# -> Edit -> Raw configuration editor -> paste this file -> Save.
title: Samduo
views:
  - title: Battery
    path: battery
    icon: mdi:home-battery
    type: sections
    max_columns: 3
    sections:
      # ── Column 1: battery ─────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Battery
            icon: mdi:home-battery
            badges:
              - type: entity
                entity: sensor.samduo_battery_soc
              - type: entity
                entity: sensor.samduo_battery_status
                show_name: false
              - type: entity
                entity: sensor.samduo_available_energy
                show_name: false
          - type: tile
            entity: select.samduo_mode
            name: Mode
            features:
              - type: select-options
            features_position: bottom
          - type: tile
            entity: sensor.samduo_strategy
            name: Strategy
            icon: mdi:brain
            color: primary
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.samduo_battery_power
                name: Battery
                color: green
              - type: tile
                entity: sensor.samduo_grid_power
                name: Grid
                color: red
              - type: tile
                entity: sensor.samduo_house_consumption
                name: House
                color: blue
          # Battery and grid power, last 3 hours. Above zero the battery is
          # discharging / the house imports; below zero it is charging / exporting.
          - type: custom:apexcharts-card
            graph_span: 3h
            update_interval: 10s
            header:
              show: true
              title: Power, last 3 hours
              show_states: false
            show:
              last_updated: false
            apex_config:
              chart:
                height: 230
              legend:
                position: top
              stroke:
                width: 2
                curve: stepline
              yaxis:
                decimalsInFloat: 0
                forceNiceScale: true
                title:
                  text: W
            series:
              - entity: sensor.samduo_battery_power
                name: Battery (+ discharging, − charging)
                type: area
                color: "#4caf50"
                opacity: 0.3
                show:
                  legend_value: false
                group_by:
                  duration: 1min
                  func: avg
              - entity: sensor.samduo_grid_power
                name: Grid (+ import, − export)
                type: line
                color: "#f44336"
                show:
                  legend_value: false
                group_by:
                  duration: 1min
                  func: avg
          # State of charge over the day.
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
            header:
              show: true
              title: State of charge today
              show_states: false
            show:
              last_updated: false
            apex_config:
              chart:
                height: 180
              legend:
                show: false
              stroke:
                width: 2
              yaxis:
                min: 0
                max: 100
                tickAmount: 4
                decimalsInFloat: 0
                title:
                  text: "%"
            series:
              - entity: sensor.samduo_battery_soc
                name: SOC
                type: area
                color: "#2196f3"
                opacity: 0.2
                extend_to: now
          - type: entities
            title: Energy
            entities:
              - entity: sensor.samduo_energy_charged
                name: Charged (total)
              - entity: sensor.samduo_energy_discharged
                name: Discharged (total)
              - entity: sensor.samduo_available_energy
                name: Available now
              - entity: sensor.samduo_energy_to_full
                name: Needed to full
              - type: conditional
                conditions:
                  - entity: sensor.samduo_battery_status
                    state: discharging
                row:
                  entity: sensor.samduo_remaining_discharge_time
                  name: Remaining discharge time
              - type: conditional
                conditions:
                  - entity: sensor.samduo_battery_status
                    state: charging
                row:
                  entity: sensor.samduo_remaining_charge_time
                  name: Remaining charge time

      # ── Column 2: control settings ────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Control
            icon: mdi:tune
            badges:
              - type: entity
                entity: binary_sensor.samduo_controlling
                show_name: false
              - type: entity
                entity: sensor.samduo_power_setpoint
                show_name: false
          - type: entities
            title: Power limits
            entities:
              - entity: number.samduo_max_charge_power
                name: Max charge power
              - entity: number.samduo_max_discharge_power
                name: Max discharge power
              - entity: number.samduo_manual_power
                name: Manual power (manual mode)
          - type: entities
            title: Zero on the meter
            entities:
              - entity: number.samduo_start_discharging_at
                name: Start discharging at
              - entity: number.samduo_discharge_margin
                name: Discharge margin
              - entity: number.samduo_start_charging_at
                name: Start charging at
              - entity: number.samduo_charge_margin
                name: Charge margin
          - type: entities
            title: State of charge
            entities:
              - entity: number.samduo_minimum_soc
                name: Minimum SOC
              - entity: number.samduo_maximum_soc
                name: Maximum SOC
              - entity: switch.samduo_soc_protection
                name: SOC protection
          - type: entities
            title: Device
            entities:
              - entity: switch.samduo_backup_output
                name: Backup output
              - entity: button.samduo_release_control
                name: Release control
              - entity: button.samduo_apply_recommended_settings
                name: Apply recommended settings
              - entity: binary_sensor.samduo_control_blocked
                name: Control blocked
              - entity: binary_sensor.samduo_grid_power_sensor
                name: Grid power sensor
          - type: markdown
            title: Modes
            content: >
              **Standby** – battery does nothing (released). **Manual** – holds the manual power.
              **Zero on the meter** – discharges on import, charges on export.
              **Dynamic NOM** – charges in the cheapest hours, then NOM.
              **Dynamic NOM (expensive only)** – charges cheap, discharges NOM only in expensive hours.
              **Dynamic trading** – charges cheap, discharges at full power when expensive.
              **Dynamic trading + NOM** – same, but NOM in between.
              **Smart charge/discharge only** – one direction of NOM.
              **Fast charge/discharge** – full power until the SOC limit.

      # ── Column 3: dynamic prices ──────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Dynamic prices
            icon: mdi:cash-multiple
            badges:
              - type: entity
                entity: sensor.samduo_current_price
                show_name: false
              - type: entity
                entity: binary_sensor.samduo_cheap_period
                show_name: false
              - type: entity
                entity: binary_sensor.samduo_expensive_period
                show_name: false
          # One bar per period: green = cheap (charging), red = expensive
          # (discharging), grey = the rest. The three series are stacked so a
          # period never shows more than one bar.
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
            header:
              show: true
              title: Prices today
              show_states: false
            show:
              last_updated: false
            apex_config:
              chart:
                height: 220
                stacked: true
              legend:
                position: top
              plotOptions:
                bar:
                  columnWidth: "85%"
              dataLabels:
                enabled: false
              yaxis:
                decimalsInFloat: 2
                forceNiceScale: true
              xaxis:
                labels:
                  datetimeFormatter:
                    hour: "HH:mm"
            series:
              - entity: sensor.samduo_price_periods_today
                name: Cheap
                type: column
                color: "#4caf50"
                opacity: 1
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: true
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (p.cheap) && (end > now) ? p.value : 0];
                  });
              - entity: sensor.samduo_price_periods_today
                name: Cheap
                type: column
                color: "#4caf50"
                opacity: 0.3
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: false
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (p.cheap) && (end <= now) ? p.value : 0];
                  });
              - entity: sensor.samduo_price_periods_today
                name: Expensive
                type: column
                color: "#f44336"
                opacity: 1
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: true
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (p.expensive && !p.cheap) && (end > now) ? p.value : 0];
                  });
              - entity: sensor.samduo_price_periods_today
                name: Expensive
                type: column
                color: "#f44336"
                opacity: 0.3
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: false
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (p.expensive && !p.cheap) && (end <= now) ? p.value : 0];
                  });
              - entity: sensor.samduo_price_periods_today
                name: Normal
                type: column
                color: "#9e9e9e"
                opacity: 1
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: true
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (!p.cheap && !p.expensive) && (end > now) ? p.value : 0];
                  });
              - entity: sensor.samduo_price_periods_today
                name: Normal
                type: column
                color: "#9e9e9e"
                opacity: 0.3
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: false
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (!p.cheap && !p.expensive) && (end <= now) ? p.value : 0];
                  });
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.samduo_spread
                name: Spread
              - type: tile
                entity: sensor.samduo_spread_nom
                name: Spread NOM
          - type: markdown
            content: >
              {% set cheap = state_attr('sensor.samduo_price_periods_today', 'cheap') or [] %}
              {% set expensive = state_attr('sensor.samduo_price_periods_today', 'expensive') or [] %}
              **Cheapest today:** {{ cheap | map('regex_replace', ' - .*', '') | join(', ') if cheap else 'none' }}<br>
              **Most expensive today:** {{ expensive | map('regex_replace', ' - .*', '') | join(', ') if expensive else 'none' }}
          - type: entities
            title: Today
            entities:
              - entity: number.samduo_cheap_periods_today
                name: Cheap periods
              - entity: number.samduo_expensive_periods_today
                name: Expensive periods
              - entity: text.samduo_manual_periods_today
                name: Manual periods
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
              offset: +1d
            header:
              show: true
              title: Prices tomorrow
              show_states: false
            show:
              last_updated: false
            apex_config:
              chart:
                height: 220
                stacked: true
              legend:
                position: top
              plotOptions:
                bar:
                  columnWidth: "85%"
              dataLabels:
                enabled: false
              yaxis:
                decimalsInFloat: 2
                forceNiceScale: true
              xaxis:
                labels:
                  datetimeFormatter:
                    hour: "HH:mm"
            series:
              - entity: sensor.samduo_price_periods_tomorrow
                name: Cheap
                type: column
                color: "#4caf50"
                opacity: 1
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: true
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (p.cheap) && (end > now) ? p.value : 0];
                  });
              - entity: sensor.samduo_price_periods_tomorrow
                name: Cheap
                type: column
                color: "#4caf50"
                opacity: 0.3
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: false
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (p.cheap) && (end <= now) ? p.value : 0];
                  });
              - entity: sensor.samduo_price_periods_tomorrow
                name: Expensive
                type: column
                color: "#f44336"
                opacity: 1
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: true
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (p.expensive && !p.cheap) && (end > now) ? p.value : 0];
                  });
              - entity: sensor.samduo_price_periods_tomorrow
                name: Expensive
                type: column
                color: "#f44336"
                opacity: 0.3
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: false
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (p.expensive && !p.cheap) && (end <= now) ? p.value : 0];
                  });
              - entity: sensor.samduo_price_periods_tomorrow
                name: Normal
                type: column
                color: "#9e9e9e"
                opacity: 1
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: true
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (!p.cheap && !p.expensive) && (end > now) ? p.value : 0];
                  });
              - entity: sensor.samduo_price_periods_tomorrow
                name: Normal
                type: column
                color: "#9e9e9e"
                opacity: 0.3
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                  in_legend: false
                data_generator: |
                  const now = Date.now();
                  return (entity.attributes.periods || []).map(p => {
                    const start = new Date(p.start).getTime(), end = new Date(p.end).getTime();
                    return [(start + end) / 2, (!p.cheap && !p.expensive) && (end <= now) ? p.value : 0];
                  });
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.samduo_spread_tomorrow
                name: Spread
              - type: tile
                entity: sensor.samduo_spread_nom_tomorrow
                name: Spread NOM
          - type: markdown
            content: >
              {% set cheap = state_attr('sensor.samduo_price_periods_tomorrow', 'cheap') or [] %}
              {% set expensive = state_attr('sensor.samduo_price_periods_tomorrow', 'expensive') or [] %}
              **Cheapest tomorrow:** {{ cheap | map('regex_replace', ' - .*', '') | join(', ') if cheap else 'not yet known' }}<br>
              **Most expensive tomorrow:** {{ expensive | map('regex_replace', ' - .*', '') | join(', ') if expensive else 'not yet known' }}
          - type: entities
            title: Tomorrow and settings
            entities:
              - entity: number.samduo_cheap_periods_tomorrow
                name: Cheap periods
              - entity: number.samduo_expensive_periods_tomorrow
                name: Expensive periods
              - entity: text.samduo_manual_periods_tomorrow
                name: Manual periods
              - entity: number.samduo_minimum_spread
                name: Minimum spread
              - entity: number.samduo_export_correction
                name: Export correction
              - entity: switch.samduo_15_minute_periods
                name: 15-minute periods

  - title: Health
    path: health
    icon: mdi:battery-heart-variant
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Battery health
            icon: mdi:battery-heart-variant
          - type: entities
            entities:
              - entity: sensor.samduo_battery_soh
                name: State of health
              - entity: sensor.samduo_battery_voltage
                name: Battery voltage
              - entity: sensor.samduo_inverter_temperature_1
                name: Inverter temperature 1
              - entity: sensor.samduo_inverter_temperature_2
                name: Inverter temperature 2
              - entity: sensor.samduo_inverter_status
                name: Inverter status
              - entity: sensor.samduo_error_code
                name: Error code
          - type: history-graph
            title: Temperatures (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.samduo_inverter_temperature_1
                name: Inverter 1
              - entity: sensor.samduo_inverter_temperature_2
                name: Inverter 2
      - type: grid
        cards:
          - type: heading
            heading: Grid and control
            icon: mdi:transmission-tower
          - type: entities
            entities:
              - entity: sensor.samduo_grid_voltage
                name: Grid voltage
              - entity: sensor.samduo_grid_frequency
                name: Grid frequency
              - entity: sensor.samduo_off_grid_voltage
                name: Off-grid voltage
              - entity: sensor.samduo_backup_power
                name: Backup power
              - entity: sensor.samduo_control_time_remaining
                name: Control time remaining
              - entity: binary_sensor.samduo_dynamic_charging
                name: Dynamic charging
              - entity: binary_sensor.samduo_dynamic_discharging
                name: Dynamic discharging
          - type: history-graph
            title: Mode and strategy (24 h)
            hours_to_show: 24
            entities:
              - entity: select.samduo_mode
                name: Mode
              - entity: sensor.samduo_strategy
                name: Strategy
